name: Update Statistics

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MMDB_BOT_APP_ID }}
          private-key: ${{ secrets.MMDB_BOT_PRIVATE_KEY }}

      - name: Update statistics
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/update-stats.mjs

      - name: Generate README
        run: node scripts/generate-readme.mjs

      - name: Commit and push
        run: |
          git diff --quiet && exit 0
          git config user.name "mmdb-bot[bot]"
          git config user.email "mmdb-bot[bot]@users.noreply.github.com"
          git add repos.json ingestion/state.json README.md
          git commit -m "chore: update statistics [skip ci]"
          git push
